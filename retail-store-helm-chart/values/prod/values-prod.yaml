# ============================================================
# RETAIL STORE - PRODUCTION VALUES
# Environment: AWS EKS Production
# ============================================================


# ============================================================
# GLOBAL CONFIGURATION
# ============================================================

global:
  environment: prod


# ============================================================
# DYNAMODB SERVICE
# ============================================================
# Disable local/in-cluster DynamoDB in production.
# Cart connects directly to AWS DynamoDB using IRSA.

retail-store-dynamodb:
  enabled: false


# ============================================================
# CART SERVICE
# ============================================================

retail-store-cart:

  image:
    repository: ahmad2001/retail-store-cart
    tag: v2

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1024Mi

  # AWS authentication through IAM Roles for Service Accounts.
  # No static AWS credentials are stored inside the container.
  aws:
    authMethod: irsa

  serviceAccount:
    create: true
    name: cart-sa
    roleArn: arn:aws:iam::118051225085:role/cart-dynamodb-role


# ============================================================
# CATALOG SERVICE
# ============================================================

retail-store-catalog:

  image:
    repository: ahmad2001/retail-store-catalog
    tag: v2

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1024Mi


# ============================================================
# CHECKOUT SERVICE
# ============================================================

retail-store-checkout:

  image:
    repository: ahmad2001/retail-store-checkout
    tag: v2

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1024Mi


# ============================================================
# ORDERS SERVICE
# ============================================================

retail-store-orders:

  image:
    repository: ahmad2001/retail-store-orders
    tag: v2

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1024Mi


# ============================================================
# UI SERVICE
# ============================================================
# Production UI is exposed externally through an AWS
# LoadBalancer instead of the development NodePort service.

retail-store-ui:

  image:
    repository: ahmad2001/retail-store-ui
    tag: v2

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1024Mi

  service:
    type: LoadBalancer


# ============================================================
# MYSQL DATABASE
# ============================================================
# MySQL stores Catalog data.
# Persistent storage is dynamically provisioned using AWS EBS.

retail-store-mysql:

  replicaCount: 1

  persistence:
    storageClass: ebs-sc
    size: 5Gi

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  secrets:
    rootPassword: password
    userPassword: password


# ============================================================
# POSTGRESQL DATABASE
# ============================================================
# PostgreSQL uses persistent AWS EBS storage.

retail-store-postgresql:

  replicaCount: 1

  persistence:
    storageClass: ebs-sc
    size: 5Gi

  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  secrets:
    postgresPassword: password


# ============================================================
# REDIS
# ============================================================

retail-store-redis:

  replicaCount: 1


# ============================================================
# RABBITMQ
# ============================================================

retail-store-rabbitmq:

  replicaCount: 1
